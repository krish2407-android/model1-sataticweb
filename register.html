<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Silver Fashion</title>
    <link rel="stylesheet" href="register.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div id="header"></div>

    <section class="section">
        <form class="form" id="registerForm">
            <h2>Create Account</h2>
            <p class="text">Join the Silver Fashion community</p>
            <div class="input">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your name" required>
            </div>
            <div class="input">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            <div class="input">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create password" required>
            </div>
            <div class="input">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" placeholder="Confirm password" required>
            </div>
            <div class="agree">
                <input type="checkbox" id="terms" required>
                <span>I agree to the <a href="#">Terms & Conditions</a></span>
            </div>
            <button type="submit" class="btn">Sign Up</button>
            <p class="link">Already have an account? <a href="Login.html">Login Here</a></p>
        </form>
    </section>

    <div id="footer"></div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            var name = document.getElementById('fullname').value.trim();
            var email = document.getElementById('email').value.trim().toLowerCase();
            var password = document.getElementById('password').value;
            var confirm = document.getElementById('confirm').value;

            if (password !== confirm) {
                alert('Passwords do not match');
                return;
            }

            var users = JSON.parse(localStorage.getItem('silverUsers') || '[]');
            var exists = users.some(function (u) { return u.email === email; });
            if (exists) {
                alert('This email is already registered');
                return;
            }

            users.push({ name: name, email: email, password: password });
            localStorage.setItem('silverUsers', JSON.stringify(users));
            localStorage.setItem('silverUser', JSON.stringify({ name: name, email: email }));
            localStorage.setItem('silverLoggedIn', '1');
            alert('Account created successfully!');
            window.location.href = 'index.html';
        });

        $(document).ready(function () {
            $('#header').load('header.html');
            $('#footer').load('footer.html');
        });
    </script>

</body>
</html>
