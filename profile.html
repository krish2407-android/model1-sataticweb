<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Silver Fashion</title>
    <link rel="stylesheet" href="profile.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <div id="header"></div>

    <section class="section">
        <div class="box1">
            <h1>My Profile</h1>
            <div class="row">
                <label class="label">Full Name</label>
                <span class="value" id="userName"></span>
            </div>
            <div class="row">
                <span class="label">Email</span>
                <span class="value" id="userEmail"></span>
            </div>
            <button type="button" class="logout" id="logoutBtn">Logout</button>
        </div>
    </section>

    <div id="footer"></div>

    <script>
        function loadProfile() {
            if (localStorage.getItem('silverLoggedIn') !== '1') {
                window.location.href = 'Login.html';
                return;
            }
            var user = JSON.parse(localStorage.getItem('silverUser') || '{}');
            document.getElementById('userName').textContent = user.name || '-';
            document.getElementById('userEmail').textContent = user.email || '-';
        }

        document.getElementById('logoutBtn').addEventListener('click', function () {
            localStorage.removeItem('silverLoggedIn');
            localStorage.removeItem('silverUser');
            window.location.href = 'Login.html';
        });

        loadProfile();

        $(document).ready(function () {
            $('#header').load('header.html');
            $('#footer').load('footer.html');
        });
    </script>

</body>
</html>
